<svg xmlns="http://www.w3.org/2000/svg"
     width="700"
     height="550"
     viewBox="0 0 700 550">

  <defs>
    <style>
      .box {
        fill: #EAF3FF;
        stroke: #000000;
        stroke-width: 2;
      }

      .txt {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 16px;
        text-anchor: middle;
        dominant-baseline: middle;
      }

      .arrow {
        stroke: #000000;
        stroke-width: 2;
        fill: none;
      }
    </style>

    <marker id="arrowhead"
            markerWidth="10"
            markerHeight="10"
            refX="8"
            refY="5"
            orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#000000"/>
    </marker>
  </defs>

  <!-- Arduino Mega -->

  <rect class="box" x="250" y="20" width="200" height="60" rx="8"/>
  <text class="txt" x="350" y="50">Arduino Mega</text>

  <!-- Arrow -->

  <line class="arrow"
        x1="350" y1="80"
        x2="350" y2="120"
        marker-end="url(#arrowhead)"/>

  <!-- UART -->

  <rect class="box" x="250" y="130" width="200" height="60" rx="8"/>
  <text class="txt" x="350" y="160">UART</text>

  <!-- Arrow -->

  <line class="arrow"
        x1="350" y1="190"
        x2="350" y2="230"
        marker-end="url(#arrowhead)"/>

  <!-- ESP32-S3 -->

  <rect class="box" x="250" y="240" width="200" height="60" rx="8"/>
  <text class="txt" x="350" y="270">ESP32-S3 Gateway</text>

  <!-- Branch Down -->

  <line class="arrow" x1="350" y1="300" x2="350" y2="340"/>

  <!-- Horizontal Branch -->

  <line class="arrow" x1="150" y1="340" x2="550" y2="340"/>

  <!-- Dashboard -->

  <line class="arrow"
        x1="150" y1="340"
        x2="150" y2="380"
        marker-end="url(#arrowhead)"/>

  <rect class="box" x="60" y="390" width="180" height="60" rx="8"/>
  <text class="txt" x="150" y="420">Dashboard</text>

  <!-- Database -->

  <line class="arrow"
        x1="350" y1="340"
        x2="350" y2="380"
        marker-end="url(#arrowhead)"/>

  <rect class="box" x="260" y="390" width="180" height="60" rx="8"/>
  <text class="txt" x="350" y="420">Database</text>

  <!-- Weather Underground -->

  <line class="arrow"
        x1="550" y1="340"
        x2="550" y2="380"
        marker-end="url(#arrowhead)"/>

  <rect class="box" x="460" y="390" width="180" height="60" rx="8"/>
  <text class="txt" x="550" y="420">Weather Underground</text>

</svg>