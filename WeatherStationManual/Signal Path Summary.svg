<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">

<defs>

<style>
.title { font: bold 16px Arial, sans-serif; fill:#000; }
.label { font: 14px Arial, sans-serif; fill:#000; }
.small { font: 11px Arial, sans-serif; fill:#000; }

.sensorBox {
    fill:#dce6f2;
    stroke:#2f75b5;
    stroke-width:2;
}

.controllerBox {
    fill:#d9ead3;
    stroke:#2e7d32;
    stroke-width:2;
}

.commBox {
    fill:#f5e6c8;
    stroke:#d99000;
    stroke-width:2;
}

.noteBox {
    fill:#f3f3f3;
    stroke:#999;
    stroke-width:1;
}

.arrow {
    stroke:#1f3349;
    stroke-width:3;
    fill:none;
    marker-end:url(#arrowhead);
}

</style>

<marker id="arrowhead"
        markerWidth="8"
        markerHeight="8"
        refX="7"
        refY="4"
        orient="auto">
    <polygon points="0,0 8,4 0,8" fill="#1f3349"/>
</marker>

</defs>

<!-- HEADER -->

<rect x="100" y="15" width="1000" height="24" rx="3" class="noteBox"/>

<text x="600" y="31" text-anchor="middle" class="small">
Signal flow from environmental sensors through processing, communications, and gateway services
</text>

<!-- LEFT COLUMN : RADIATION SHIELD -->

<rect x="60" y="80" width="260" height="70" rx="10" class="sensorBox"/>
<text x="190" y="108" text-anchor="middle" class="title">SHT31-D</text>
<text x="190" y="130" text-anchor="middle" class="small">Temperature / Humidity</text>

<rect x="60" y="180" width="260" height="70" rx="10" class="sensorBox"/>
<text x="190" y="208" text-anchor="middle" class="title">BMP280</text>
<text x="190" y="230" text-anchor="middle" class="small">Pressure / Backup Temperature</text>

<rect x="60" y="280" width="260" height="70" rx="10" class="sensorBox"/>
<text x="190" y="308" text-anchor="middle" class="title">DS3231 RTC</text>
<text x="190" y="330" text-anchor="middle" class="small">Date and Time</text>

<!-- ARDUINO -->

<rect x="360" y="210" width="320" height="110" rx="10" class="controllerBox"/>

<text x="520" y="255" text-anchor="middle" class="title">
Arduino Mega 2560
</text>

<text x="520" y="282" text-anchor="middle" class="small">
Weather Data Aggregation
</text>

<!-- UART -->

<rect x="360" y="410" width="320" height="70" rx="10" class="commBox"/>

<text x="520" y="452" text-anchor="middle" class="title">
UART (Serial1)
</text>

<!-- ESP32-S3 -->

<rect x="360" y="560" width="320" height="100" rx="10" class="controllerBox"/>

<text x="520" y="605" text-anchor="middle" class="title">
ESP32-S3 Gateway
</text>

<text x="520" y="630" text-anchor="middle" class="small">
Dashboard and Upload Services
</text>

<!-- RIGHT COLUMN : MAST SENSORS -->

<rect x="860" y="80" width="260" height="70" rx="10" class="sensorBox"/>
<text x="990" y="122" text-anchor="middle" class="title">Wind Vane</text>

<rect x="860" y="180" width="260" height="70" rx="10" class="sensorBox"/>
<text x="990" y="222" text-anchor="middle" class="title">Anemometer</text>

<rect x="860" y="280" width="260" height="70" rx="10" class="sensorBox"/>
<text x="990" y="322" text-anchor="middle" class="title">Rain Gauge</text>

<!-- ESP32-C3 -->

<rect x="820" y="410" width="340" height="110" rx="10" class="controllerBox"/>

<text x="990" y="455" text-anchor="middle" class="title">
ESP32-C3
</text>

<text x="990" y="482" text-anchor="middle" class="small">
Wind and Rain Processing
</text>

<!-- LORA -->

<rect x="820" y="610" width="340" height="70" rx="10" class="commBox"/>

<text x="990" y="652" text-anchor="middle" class="title">
LoRa Link
</text>

<!-- LEFT SENSOR CONNECTIONS -->

<line x1="320" y1="115" x2="360" y2="240" class="arrow"/>
<line x1="320" y1="215" x2="360" y2="260" class="arrow"/>
<line x1="320" y1="315" x2="360" y2="280" class="arrow"/>

<text x="315" y="175" class="small">I²C Bus</text>

<!-- ARDUINO TO UART -->

<line x1="520" y1="320" x2="520" y2="410" class="arrow"/>

<!-- UART TO S3 -->

<line x1="520" y1="480" x2="520" y2="560" class="arrow"/>

<!-- RIGHT SENSOR CONNECTIONS -->

<line x1="990" y1="150" x2="990" y2="410" class="arrow"/>
<line x1="990" y1="250" x2="990" y2="410" class="arrow"/>
<line x1="990" y1="350" x2="990" y2="410" class="arrow"/>

<!-- ESP32 TO LORA -->

<line x1="990" y1="520" x2="990" y2="610" class="arrow"/>

<!-- LORA TO ARDUINO -->

<path d="M820 645 L740 645 L740 265 L680 265"
      class="arrow"/>

<text x="748" y="620" class="small">
915 MHz
</text>

</svg>