<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="900"
     height="650"
     viewBox="0 0 900 650">

  <defs>

    <style>
      .label{
        font-family:Arial,Helvetica,sans-serif;
        font-size:20px;
        text-anchor:middle;
        dominant-baseline:middle;
        fill:#222222;
      }

      .blueBox{
        fill:#d9e2ef;
        stroke:#1565c0;
        stroke-width:3;
      }

      .greenBox{
        fill:#d8ead3;
        stroke:#2e7d32;
        stroke-width:3;
      }

      .goldBox{
        fill:#f6e7bf;
        stroke:#d9a300;
        stroke-width:3;
      }

      .flow{
        stroke:#17324d;
        stroke-width:2.5;
        fill:none;
      }
    </style>

    <marker id="arrow"
            markerWidth="10"
            markerHeight="10"
            refX="5"
            refY="5"
            orient="auto">
      <path d="M0,0 L10,5 L0,10 Z"
            fill="#17324d"/>
    </marker>

  </defs>

  <!-- Sensor Inputs -->

  <rect x="60" y="20"
        width="220"
        height="60"
        rx="12"
        class="blueBox"/>

  <text x="170" y="50"
        class="label">
    Wind Vane
  </text>

  <rect x="340" y="20"
        width="220"
        height="60"
        rx="12"
        class="blueBox"/>

  <text x="450" y="50"
        class="label">
    Anemometer
  </text>

  <rect x="620" y="20"
        width="220"
        height="60"
        rx="12"
        class="blueBox"/>

  <text x="730" y="50"
        class="label">
    Rain Gauge
  </text>

  <!-- ESP32-C3 -->

  <rect x="270" y="130"
        width="360"
        height="70"
        rx="12"
        class="greenBox"/>

  <text x="450" y="165"
        class="label">
    ESP32-C3
  </text>

  <!-- LoRa -->

  <rect x="270" y="240"
        width="360"
        height="70"
        rx="12"
        class="goldBox"/>

  <text x="450" y="275"
        class="label">
    LoRa
  </text>

  <!-- Arduino Mega -->

  <rect x="270" y="350"
        width="360"
        height="70"
        rx="12"
        class="greenBox"/>

  <text x="450" y="385"
        class="label">
    Arduino Mega
  </text>

  <!-- UART -->

  <rect x="270" y="460"
        width="360"
        height="70"
        rx="12"
        class="goldBox"/>

  <text x="450" y="495"
        class="label">
    UART
  </text>

  <!-- ESP32-S3 -->

  <rect x="270" y="570"
        width="360"
        height="70"
        rx="12"
        class="greenBox"/>

  <text x="450" y="605"
        class="label">
    ESP32-S3
  </text>

  <!-- Sensor Connections -->

  <line x1="170" y1="80"
        x2="430" y2="128"
        class="flow"
        marker-end="url(#arrow)"/>

  <line x1="450" y1="80"
        x2="450" y2="128"
        class="flow"
        marker-end="url(#arrow)"/>

  <line x1="730" y1="80"
        x2="470" y2="128"
        class="flow"
        marker-end="url(#arrow)"/>

  <!-- Vertical Flow -->

  <line x1="450" y1="200"
        x2="450" y2="238"
        class="flow"
        marker-end="url(#arrow)"/>

  <line x1="450" y1="310"
        x2="450" y2="348"
        class="flow"
        marker-end="url(#arrow)"/>

  <line x1="450" y1="420"
        x2="450" y2="458"
        class="flow"
        marker-end="url(#arrow)"/>

  <line x1="450" y1="530"
        x2="450" y2="568"
        class="flow"
        marker-end="url(#arrow)"/>

</svg>