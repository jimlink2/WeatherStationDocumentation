<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1000"
     height="620"
     viewBox="0 0 1000 620">

  <defs>

    <style>
      .title{
        font-family:Arial,sans-serif;
        font-size:18px;
        fill:#222222;
        text-anchor:middle;
      }

      .subtitle{
        font-family:Arial,sans-serif;
        font-size:12px;
        fill:#333333;
        text-anchor:middle;
      }

      .note{
        font-family:Arial,sans-serif;
        font-size:13px;
        fill:#333333;
      }

      .box{
        stroke-width:3;
      }

      .source{
        fill:#d9ead7;
        stroke:#5a9d54;
      }

      .process{
        fill:#d9e1ea;
        stroke:#2f80ed;
      }

      .ui{
        fill:#efe4bf;
        stroke:#d79a00;
      }

      .footer{
        fill:#efefef;
        stroke:#b5b5b5;
        stroke-width:2;
      }

      .flow{
        stroke:#1b2b3a;
        stroke-width:4;
        fill:none;
      }

    </style>

    <marker id="arrow"
            markerWidth="6"
            markerHeight="5"
            refX="5"
            refY="2.5"
            orient="auto">
      <polygon points="0,0 6,2.5 0,5"
               fill="#1b2b3a"/>
    </marker>

  </defs>

  <!-- Arduino Mega -->

  <rect x="350"
        y="30"
        width="280"
        height="70"
        rx="10"
        ry="10"
        class="box source"/>

  <text x="490"
        y="70"
        class="title">
    Arduino Mega 2560
  </text>

  <text x="490"
        y="90"
        class="subtitle">
    Weather Data Source
  </text>

  <!-- Flow -->

  <line x1="490"
        y1="100"
        x2="490"
        y2="145"
        class="flow"
        marker-end="url(#arrow)"/>

  <!-- ESP32-S3 Parser -->

  <rect x="350"
        y="145"
        width="280"
        height="75"
        rx="10"
        ry="10"
        class="box process"/>

  <text x="490"
        y="185"
        class="title">
    ESP32-S3 Parser
  </text>

  <text x="490"
        y="205"
        class="subtitle">
    Weather Packet Processing
  </text>

  <!-- Flow -->

  <line x1="490"
        y1="220"
        x2="490"
        y2="275"
        class="flow"
        marker-end="url(#arrow)"/>

  <!-- Dashboard Variables -->

  <rect x="350"
        y="275"
        width="280"
        height="80"
        rx="10"
        ry="10"
        class="box process"/>

  <text x="490"
        y="317"
        class="title">
    Dashboard Variables
  </text>

  <text x="490"
        y="340"
        class="subtitle">
    Temperature • Humidity • Pressure
  </text>

  <!-- Web Browser -->

  <rect x="40"
        y="275"
        width="155"
        height="80"
        rx="10"
        ry="10"
        class="box ui"/>

  <text x="118"
        y="317"
        class="title">
    Web Browser
  </text>

  <text x="118"
        y="340"
        class="subtitle">
    Dashboard View
  </text>

  <!-- Browser Connection -->

  <line x1="350"
        y1="315"
        x2="195"
        y2="315"
        class="flow"
        marker-end="url(#arrow)"/>

  <!-- Flow -->

  <line x1="490"
        y1="355"
        x2="490"
        y2="430"
        class="flow"
        marker-end="url(#arrow)"/>

  <!-- Dashboard Engine -->

  <rect x="350"
        y="430"
        width="280"
        height="85"
        rx="10"
        ry="10"
        class="box ui"/>

  <text x="490"
        y="470"
        class="title">
    Dashboard Engine
  </text>

  <text x="490"
        y="492"
        class="subtitle">
    HTML Generation
  </text>

  <text x="490"
        y="512"
        class="subtitle">
    Status Panels and Widgets
  </text>

  <!-- Footer -->

  <rect x="35"
        y="555"
        width="930"
        height="45"
        rx="6"
        ry="6"
        class="footer"/>

  <text x="50"
        y="575"
        class="note">
    Weather packets received from the Arduino Mega are parsed by the ESP32-S3,
  </text>

  <text x="50"
        y="591"
        class="note">
    converted into dashboard variables, and rendered through the web dashboard.
  </text>

</svg>
