<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1000"
     height="700"
     viewBox="0 0 1000 700">

<defs>

<style>

.title {
    font-family: Arial, sans-serif;
    font-size: 28px;
    font-weight: bold;
    text-anchor: middle;
}

.subtitle {
    font-family: Arial, sans-serif;
    font-size: 18px;
    text-anchor: middle;
}

.label {
    font-family: Arial, sans-serif;
    font-size: 22px;
    text-anchor: middle;
    dominant-baseline: middle;
}

.note {
    font-family: Arial, sans-serif;
    font-size: 18px;
    text-anchor: middle;
}

.device {
    fill: #dfe8f3;
    stroke: #0066cc;
    stroke-width: 3;
}

.bus {
    stroke: #203040;
    stroke-width: 8;
}

.connection {
    stroke: #203040;
    stroke-width: 4;
}

</style>

</defs>

<!-- Title -->

<text x="500" y="50" class="title">
I²C Sensor Bus Diagram
</text>

<text x="500" y="85" class="subtitle">
Arduino Mega Indoor Sensor Communications Network
</text>

<!-- Main Bus -->

<line x1="250" y1="350"
      x2="750" y2="350"
      class="bus"/>

<text x="400" y="325" class="note">
I²C BUS
</text>

<!-- SDA/SCL labels -->

<text x="500" y="390" class="note">
SDA (D20)    --    SCL (D21)
</text>

<!-- Arduino Mega -->

<line x1="500" y1="250"
      x2="500" y2="350"
      class="connection"/>

<rect x="375"
      y="120"
      width="250"
      height="130"
      rx="15"
      class="device"/>

<text x="500" y="185" class="label">
Arduino Mega 2560
</text>

<!-- SHT31-D -->

<line x1="300" y1="350"
      x2="300" y2="470"
      class="connection"/>

<rect x="200"
      y="470"
      width="140"
      height="100"
      rx="15"
      class="device"/>

<text x="270" y="520" class="label">
SHT31-D
</text>

<!-- BMP280 -->

<line x1="500" y1="350"
      x2="500" y2="470"
      class="connection"/>

<rect x="430"
      y="470"
      width="140"
      height="100"
      rx="15"
      class="device"/>

<text x="500" y="520" class="label">
BMP280
</text>

<!-- DS3231 -->

<line x1="700" y1="350"
      x2="700" y2="470"
      class="connection"/>

<rect x="650"
      y="470"
      width="140"
      height="100"
      rx="15"
      class="device"/>

<text x="720" y="520" class="label">
DS3231 RTC
</text>

<!-- Function labels -->

<text x="280" y="620" class="note">
Temp / Humidity
</text>

<text x="500" y="620" class="note">
Pressure / Backup Temp
</text>

<text x="720" y="620" class="note">
Real-Time Clock
</text>

</svg>