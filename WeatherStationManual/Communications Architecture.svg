<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="1150"
     viewBox="0 0 1200 1150">

  <defs>

    <style>
      .label {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 20px;
        text-anchor: middle;
        dominant-baseline: middle;
        fill: #222222;
      }

      .small {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 16px;
        text-anchor: middle;
        dominant-baseline: middle;
        fill: #222222;
      }

      .sensorBox {
        fill: #d9e2ef;
        stroke: #1565c0;
        stroke-width: 3;
      }

      .controllerBox {
        fill: #d8ead3;
        stroke: #2e7d32;
        stroke-width: 3;
      }

      .commBox {
        fill: #f6e7bf;
        stroke: #d9a300;
        stroke-width: 3;
      }

      .serviceBox {
        fill: #e3d8ef;
        stroke: #7b1fa2;
        stroke-width: 3;
      }

      .flow {
        stroke: #17324d;
        stroke-width: 2.5;
        fill: none;
      }
    </style>

    <marker id="arrow"
            markerWidth="10"
            markerHeight="10"
            refX="8"
            refY="5"
            orient="auto">
      <path d="M0,0 L10,5 L0,10 Z"
            fill="#17324d"/>
    </marker>

  </defs>

  <!-- ================================================= -->
  <!-- OUTDOOR SUBSYSTEM                                 -->
  <!-- ================================================= -->

  <rect x="650" y="180"
        width="320"
        height="70"
        rx="12"
        class="controllerBox"/>

  <text x="810" y="215"
        class="label">ESP32-C3</text>

  <!-- Outdoor Sensors -->

  <rect x="1030" y="90"
        width="140"
        height="60"
        rx="12"
        class="sensorBox"/>

  <text x="1100" y="120"
        class="small">Wind Vane</text>

  <rect x="1030" y="180"
        width="140"
        height="60"
        rx="12"
        class="sensorBox"/>

  <text x="1100" y="210"
        class="small">Anemometer</text>

  <rect x="1030" y="270"
        width="140"
        height="60"
        rx="12"
        class="sensorBox"/>

  <text x="1100" y="300"
        class="small">Rain Gauge</text>

  <!-- Outdoor Bus -->

  <line x1="990" y1="120"
        x2="990" y2="300"
        class="flow"/>

  <line x1="1030" y1="120"
        x2="990" y2="120"
        class="flow"/>

  <line x1="1030" y1="210"
        x2="990" y2="210"
        class="flow"/>

  <line x1="1030" y1="300"
        x2="990" y2="300"
        class="flow"/>

  <line x1="990" y1="215"
        x2="970" y2="215"
        class="flow"
        marker-end="url(#arrow)"/>

  <!-- Layer 1 -->

  <rect x="700" y="330"
        width="220"
        height="60"
        rx="12"
        class="commBox"/>

  <text x="810" y="355"
        class="small">Layer 1</text>

  <text x="810" y="375"
        class="small">LoRa</text>

  <line x1="810" y1="250"
        x2="810" y2="330"
        class="flow"
        marker-end="url(#arrow)"/>

  <!-- ================================================= -->
  <!-- ARDUINO MEGA                                      -->
  <!-- ================================================= -->

  <rect x="440" y="470"
        width="320"
        height="70"
        rx="12"
        class="controllerBox"/>

  <text x="600" y="505"
        class="label">Arduino Mega</text>

  <!-- Indoor Sensors -->

  <rect x="30" y="340"
        width="220"
        height="60"
        rx="12"
        class="sensorBox"/>

  <text x="140" y="370"
        class="label">SHT31-D</text>

  <rect x="30" y="430"
        width="220"
        height="60"
        rx="12"
        class="sensorBox"/>

  <text x="140" y="460"
        class="label">BMP280</text>

  <rect x="30" y="520"
        width="220"
        height="60"
        rx="12"
        class="sensorBox"/>

  <text x="140" y="550"
        class="label">DS3231 RTC</text>

  <!-- Indoor Bus -->

  <line x1="330" y1="370"
        x2="330" y2="550"
        class="flow"/>

  <line x1="250" y1="370"
        x2="330" y2="370"
        class="flow"/>

  <line x1="250" y1="460"
        x2="330" y2="460"
        class="flow"/>

  <line x1="250" y1="550"
        x2="330" y2="550"
        class="flow"/>

  <line x1="330" y1="505"
        x2="440" y2="505"
        class="flow"
        marker-end="url(#arrow)"/>

  <!-- LoRa to Arduino -->

  <line x1="700" y1="390"
        x2="650" y2="470"
        class="flow"
        marker-end="url(#arrow)"/>

  <!-- ================================================= -->
  <!-- LAYER 2                                           -->
  <!-- ================================================= -->

  <rect x="490" y="620"
        width="220"
        height="60"
        rx="12"
        class="commBox"/>

  <text x="600" y="645"
        class="small">Layer 2</text>

  <text x="600" y="665"
        class="small">UART</text>

  <line x1="600"
        y1="540"
        x2="600"
        y2="620"
        class="flow"
        marker-end="url(#arrow)"/>

  <!-- ================================================= -->
  <!-- ESP32-S3                                          -->
  <!-- ================================================= -->

  <rect x="440"
        y="760"
        width="320"
        height="70"
        rx="12"
        class="controllerBox"/>

  <text x="600"
        y="795"
        class="label">ESP32-S3 Gateway</text>

  <line x1="600"
        y1="680"
        x2="600"
        y2="760"
        class="flow"
        marker-end="url(#arrow)"/>

  <!-- ================================================= -->
  <!-- LAYER 3                                           -->
  <!-- ================================================= -->

  <rect x="490"
        y="860"
        width="220"
        height="60"
        rx="12"
        class="commBox"/>

  <text x="600"
        y="885"
        class="small">Layer 3</text>

  <text x="600"
        y="905"
        class="small">HTTP</text>

  <line x1="600"
        y1="830"
        x2="600"
        y2="860"
        class="flow"
        marker-end="url(#arrow)"/>

  <!-- ================================================= -->
  <!-- DESTINATIONS                                      -->
  <!-- ================================================= -->

  <rect x="60"
        y="980"
        width="240"
        height="60"
        rx="12"
        class="serviceBox"/>

  <text x="180"
        y="1010"
        class="label">Dashboard</text>

  <rect x="480"
        y="980"
        width="240"
        height="60"
        rx="12"
        class="serviceBox"/>

  <text x="600"
        y="1010"
        class="label">Database</text>

  <rect x="900"
        y="980"
        width="240"
        height="60"
        rx="12"
        class="serviceBox"/>

  <text x="1020"
        y="1010"
        class="small">Weather Underground</text>

  <!-- HTTP Fan-Out -->

  <line x1="600"
        y1="920"
        x2="600"
        y2="960"
        class="flow"/>

  <line x1="180"
        y1="960"
        x2="1020"
        y2="960"
        class="flow"/>

  <line x1="180"
        y1="960"
        x2="180"
        y2="980"
        class="flow"
        marker-end="url(#arrow)"/>

  <line x1="600"
        y1="960"
        x2="600"
        y2="980"
        class="flow"
        marker-end="url(#arrow)"/>

  <line x1="1020"
        y1="960"
        x2="1020"
        y2="980"
        class="flow"
        marker-end="url(#arrow)"/>

</svg>