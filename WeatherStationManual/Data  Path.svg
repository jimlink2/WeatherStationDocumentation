<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">

<defs>

<style>
.title { font: bold 18px Arial, sans-serif; fill:#000; }
.label { font: 14px Arial, sans-serif; fill:#000; }
.small { font: 11px Arial, sans-serif; fill:#000; }

.blueBox {
    fill:#dce6f2;
    stroke:#2f75b5;
    stroke-width:2;
}

.greenBox {
    fill:#d9ead3;
    stroke:#2e7d32;
    stroke-width:2;
}

.goldBox {
    fill:#f5e6c8;
    stroke:#d99000;
    stroke-width:2;
}

.noteBox {
    fill:#f3f3f3;
    stroke:#999;
    stroke-width:1;
}

.arrow {
    stroke:#1f3349;
    stroke-width:3;
    fill:none;
    marker-end:url(#arrowhead);
}

</style>

<marker id="arrowhead"
        markerWidth="8"
        markerHeight="8"
        refX="7"
        refY="4"
        orient="auto">
    <polygon points="0,0 8,4 0,8" fill="#1f3349"/>
</marker>

</defs>

<!-- Radiation Shield -->

<rect x="80" y="90" width="280" height="80" rx="10" class="blueBox"/>

<text x="220" y="120" text-anchor="middle" class="title">
Radiation Shield
</text>

<text x="220" y="145" text-anchor="middle" class="title">
Sensor Package
</text>

<!-- Mast Sensors -->

<rect x="640" y="90" width="280" height="80" rx="10" class="blueBox"/>

<text x="780" y="120" text-anchor="middle" class="title">
Mast-mounted
</text>

<text x="780" y="145" text-anchor="middle" class="title">
Sensor System
</text>

<!-- Arduino -->

<rect x="360" y="280" width="280" height="100" rx="10" class="greenBox"/>

<text x="500" y="325" text-anchor="middle" class="title">
Arduino Mega 2560
</text>

<text x="500" y="350" text-anchor="middle" class="small">
Weather Data Aggregation
</text>

<!-- ESP32-S3 -->

<rect x="360" y="460" width="280" height="100" rx="10" class="greenBox"/>

<text x="500" y="505" text-anchor="middle" class="title">
ESP32-S3 Gateway
</text>

<text x="500" y="530" text-anchor="middle" class="small">
Presentation and Cloud Services
</text>

<!-- Dashboard -->

<rect x="40" y="470" width="220" height="80" rx="10" class="goldBox"/>

<text x="150" y="520" text-anchor="middle" class="title">
Web Dashboard
</text>

<!-- Database -->

<rect x="390" y="605" width="220" height="55" rx="10" class="goldBox"/>

<text x="500" y="640" text-anchor="middle" class="title">
Database
</text>

<!-- Weather Underground -->

<rect x="740" y="470" width="220" height="80" rx="10" class="goldBox"/>

<text x="850" y="510" text-anchor="middle" class="title">
Weather
</text>

<text x="850" y="535" text-anchor="middle" class="title">
Underground
</text>

<!-- Arrows -->

<!-- Radiation shield to Mega -->

<path d="M220 170 L220 330 L360 330" class="arrow"/>

<text x="245" y="245" class="small">
I²C
</text>

<!-- Mast System to Mega -->

<path d="M780 170 L780 330 L640 330" class="arrow"/>

<text x="700" y="245" class="small">
LoRa
</text>

<!-- Mega to Gateway -->

<line x1="500" y1="380"
      x2="500" y2="460"
      class="arrow"/>

<!-- Gateway to Dashboard -->

<line x1="360" y1="510"
      x2="260" y2="510"
      class="arrow"/>

<!-- Gateway to Weather Underground -->

<line x1="640" y1="510"
      x2="740" y2="510"
      class="arrow"/>

<!-- Gateway to Database -->

<line x1="500" y1="560"
      x2="500" y2="605"
      class="arrow"/>

<!-- Footer -->

<rect x="30" y="675"
      width="940"
      height="20"
      rx="2"
      class="noteBox"/>

<text x="500"
      y="689"
      text-anchor="middle"
      class="small">
Weather measurements originate from two sensor subsystems, are consolidated by the Arduino Mega,
forwarded to the ESP32-S3 gateway, and distributed to dashboard, database, and cloud services.
</text>

</svg>