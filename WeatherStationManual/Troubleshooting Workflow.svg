<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1000"
     height="920"
     viewBox="0 0 1000 920">

  <defs>

    <style>
      .title{
        font-family:Arial,sans-serif;
        font-size:18px;
        fill:#222222;
        text-anchor:middle;
      }

      .subtitle{
        font-family:Arial,sans-serif;
        font-size:12px;
        fill:#333333;
        text-anchor:middle;
      }

      .note{
        font-family:Arial,sans-serif;
        font-size:13px;
        fill:#333333;
      }

      .decisionLabel{
        font-family:Arial,sans-serif;
        font-size:13px;
        font-weight:bold;
        fill:#333333;
      }

      .flow{
        stroke:#1b2b3a;
        stroke-width:4;
        fill:none;
      }

      .decision{
        fill:#efe4bf;
        stroke:#d79a00;
        stroke-width:3;
      }

      .good{
        fill:#d9ead7;
        stroke:#5a9d54;
        stroke-width:3;
      }

      .problem{
        fill:#ead7d7;
        stroke:#c9302c;
        stroke-width:3;
      }

      .start{
        fill:#d9e1ea;
        stroke:#2f80ed;
        stroke-width:3;
      }

      .footer{
        fill:#efefef;
        stroke:#b5b5b5;
        stroke-width:2;
      }

    </style>

    <marker id="arrow"
            markerWidth="6"
            markerHeight="5"
            refX="5"
            refY="2.5"
            orient="auto">
      <polygon points="0,0 6,2.5 0,5"
               fill="#1b2b3a"/>
    </marker>

  </defs>

  <!-- Problem Reported -->

  <rect x="350"
        y="20"
        width="280"
        height="60"
        rx="10"
        ry="10"
        class="start"/>

  <text x="490"
        y="56"
        class="title">
    Problem Reported
  </text>

  <!-- Arrow -->

  <line x1="490"
        y1="80"
        x2="490"
        y2="135"
        class="flow"
        marker-end="url(#arrow)"/>

  <!-- Verify Power Sources -->

  <rect x="350"
        y="135"
        width="280"
        height="60"
        rx="10"
        ry="10"
        class="good"/>

  <text x="490"
        y="171"
        class="title">
    Verify Power Sources
  </text>

  <!-- Arrow -->

  <line x1="490"
        y1="195"
        x2="490"
        y2="245"
        class="flow"
        marker-end="url(#arrow)"/>

  <!-- Controllers Running Decision -->

  <polygon points="490,245 590,315 490,385 390,315"
           class="decision"/>

  <text x="490"
        y="307"
        class="title">
    Controllers
  </text>

  <text x="490"
        y="332"
        class="title">
    Running?
  </text>

  <!-- YES/NO labels -->

  <text x="350"
        y="305"
        class="decisionLabel">
    NO
  </text>

  <text x="505"
        y="412"
        class="decisionLabel">
    YES
  </text>

  <!-- Repair Power -->

  <rect x="55"
        y="285"
        width="200"
        height="60"
        rx="10"
        ry="10"
        class="problem"/>

  <text x="155"
        y="321"
        class="title">
    Repair Power
  </text>

  <line x1="390"
        y1="315"
        x2="255"
        y2="315"
        class="flow"
        marker-end="url(#arrow)"/>

  <!-- Downward path -->

  <line x1="490"
        y1="385"
        x2="490"
        y2="450"
        class="flow"
        marker-end="url(#arrow)"/>

  <!-- Check LoRa -->

  <rect x="350"
        y="450"
        width="280"
        height="60"
        rx="10"
        ry="10"
        class="good"/>

  <text x="490"
        y="486"
        class="title">
    Check LoRa Communications
  </text>

  <!-- Arrow -->

  <line x1="490"
        y1="510"
        x2="490"
        y2="555"
        class="flow"
        marker-end="url(#arrow)"/>

  <!-- LoRa Healthy Decision -->

  <polygon points="490,555 590,625 490,695 390,625"
           class="decision"/>

  <text x="490"
        y="618"
        class="title">
    LoRa
  </text>

  <text x="490"
        y="643"
        class="title">
    Healthy?
  </text>

  <!-- YES/NO labels -->

  <text x="350"
        y="615"
        class="decisionLabel">
    NO
  </text>

  <text x="610"
        y="615"
        class="decisionLabel">
    YES
  </text>

  <!-- Repair LoRa -->

  <rect x="55"
        y="595"
        width="200"
        height="60"
        rx="10"
        ry="10"
        class="problem"/>

  <text x="155"
        y="631"
        class="title">
    Repair LoRa Link
  </text>

  <line x1="390"
        y1="625"
        x2="255"
        y2="625"
        class="flow"
        marker-end="url(#arrow)"/>

  <!-- Check Dashboard -->

  <rect x="690"
        y="595"
        width="210"
        height="60"
        rx="10"
        ry="10"
        class="good"/>

  <text x="795"
        y="631"
        class="title">
    Check Dashboard
  </text>

  <line x1="590"
        y1="625"
        x2="690"
        y2="625"
        class="flow"
        marker-end="url(#arrow)"/>

  <!-- Root Cause -->

  <rect x="690"
        y="735"
        width="210"
        height="60"
        rx="10"
        ry="10"
        class="good"/>

  <text x="795"
        y="771"
        class="title">
    Root Cause Identified
  </text>

  <line x1="795"
        y1="655"
        x2="795"
        y2="735"
        class="flow"
        marker-end="url(#arrow)"/>

  <!-- Footer -->

  <rect x="55"
        y="835"
        width="880"
        height="55"
        rx="6"
        ry="6"
        class="footer"/>

  <text x="70"
        y="858"
        class="note">
    Follow the troubleshooting sequence from power verification through communications and dashboard
  </text>

  <text x="70"
        y="874"
        class="note">
    validation to rapidly isolate the source of system failures.
  </text>

</svg>