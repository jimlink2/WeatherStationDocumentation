<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900">

<defs>

<style>
.title { font: bold 16px Arial, sans-serif; fill:#000; }
.small { font: 11px Arial, sans-serif; fill:#000; }

.sensorBox {
    fill:#dce6f2;
    stroke:#2f75b5;
    stroke-width:2;
}

.controllerBox {
    fill:#d9ead3;
    stroke:#2e7d32;
    stroke-width:2;
}

.commBox {
    fill:#f5e6c8;
    stroke:#d99000;
    stroke-width:2;
}

.serviceBox {
    fill:#d9cfe5;
    stroke:#7b1fa2;
    stroke-width:2;
}

.noteBox {
    fill:#f3f3f3;
    stroke:#999;
    stroke-width:1;
}

.arrow {
    stroke:#1f3349;
    stroke-width:3;
    fill:none;
    marker-end:url(#arrowhead);
}

</style>

<marker id="arrowhead"
        markerWidth="8"
        markerHeight="8"
        refX="7"
        refY="4"
        orient="auto">
    <polygon points="0,0 8,4 0,8" fill="#1f3349"/>
</marker>

</defs>

<!-- Sensor Sources -->

<rect x="120" y="60" width="320" height="80" rx="10" class="sensorBox"/>
<text x="280" y="95" text-anchor="middle" class="title">
Radiation Shield
</text>
<text x="280" y="118" text-anchor="middle" class="small">
Temperature • Humidity • Pressure • Time
</text>

<rect x="560" y="60" width="320" height="80" rx="10" class="sensorBox"/>
<text x="720" y="95" text-anchor="middle" class="title">
Mast-mounted Sensor System
</text>
<text x="720" y="118" text-anchor="middle" class="small">
Wind • Rainfall
</text>

<!-- ESP32-C3 -->

<rect x="560" y="200" width="320" height="90" rx="10" class="controllerBox"/>
<text x="720" y="240" text-anchor="middle" class="title">
ESP32-C3
</text>
<text x="720" y="265" text-anchor="middle" class="small">
Wind and Rain Processing
</text>

<!-- Arduino -->

<rect x="340" y="360" width="320" height="90" rx="10" class="controllerBox"/>
<text x="500" y="400" text-anchor="middle" class="title">
Arduino Mega 2560
</text>
<text x="500" y="425" text-anchor="middle" class="small">
Weather Data Aggregation
</text>

<!-- ESP32-S3 -->

<rect x="340" y="540" width="320" height="90" rx="10" class="controllerBox"/>
<text x="500" y="580" text-anchor="middle" class="title">
ESP32-S3 Gateway
</text>
<text x="500" y="605" text-anchor="middle" class="small">
Upload Services
</text>

<!-- weatherdb.php -->

<rect x="340" y="710" width="320" height="80" rx="10" class="serviceBox"/>
<text x="500" y="758" text-anchor="middle" class="title">
weatherdb.php
</text>

<!-- Database -->

<rect x="340" y="840" width="320" height="50" rx="10" class="serviceBox"/>
<text x="500" y="872" text-anchor="middle" class="title">
Database
</text>

<!-- Connections -->

<!-- Radiation Shield to Mega -->

<path d="M280 140 L280 405 L340 405"
      class="arrow"/>

<!-- Mast Sensors to C3 -->

<line x1="720" y1="140"
      x2="720" y2="200"
      class="arrow"/>

<!-- C3 to Mega -->

<path d="M560 245 L500 245 L500 360"
      class="arrow"/>

<!-- Mega to S3 -->

<line x1="500" y1="450"
      x2="500" y2="540"
      class="arrow"/>

<!-- S3 to PHP -->

<line x1="500" y1="630"
      x2="500" y2="710"
      class="arrow"/>

<!-- PHP to Database -->

<line x1="500" y1="790"
      x2="500" y2="840"
      class="arrow"/>

<!-- Labels -->

<text x="295" y="250" class="small">I²C</text>
<text x="540" y="280" class="small">LoRa</text>
<text x="515" y="500" class="small">UART</text>
<text x="515" y="675" class="small">HTTP/PHP</text>

<!-- Footer -->

<rect x="40" y="10" width="920" height="24" rx="3" class="noteBox"/>

<text x="500" y="27" text-anchor="middle" class="small">
Database architecture showing end-to-end flow from sensor acquisition through storage services
</text>

</svg>