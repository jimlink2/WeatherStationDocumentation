<svg xmlns="http://www.w3.org/2000/svg"
     width="500"
     height="500"
     viewBox="0 0 500 500">

  <defs>
    <style>
      .box {
        fill: #EAF3FF;
        stroke: #000000;
        stroke-width: 2;
      }

      .txt {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 16px;
        text-anchor: middle;
        dominant-baseline: middle;
      }

      .arrow {
        stroke: #000000;
        stroke-width: 2;
        fill: none;
      }
    </style>

    <marker id="arrowhead"
            markerWidth="10"
            markerHeight="10"
            refX="8"
            refY="5"
            orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#000000"/>
    </marker>
  </defs>

  <!-- Step 1 -->

  <rect class="box" x="100" y="20" width="300" height="60" rx="8"/>
  <text class="txt" x="250" y="50">
    Store Previous Records
  </text>

  <line class="arrow"
        x1="250"
        y1="80"
        x2="250"
        y2="120"
        marker-end="url(#arrowhead)"/>

  <!-- Step 2 -->

  <rect class="box" x="100" y="130" width="300" height="60" rx="8"/>
  <text class="txt" x="250" y="160">
    Update Reset Timestamp
  </text>

  <line class="arrow"
        x1="250"
        y1="190"
        x2="250"
        y2="230"
        marker-end="url(#arrowhead)"/>

  <!-- Step 3 -->

  <rect class="box" x="100" y="240" width="300" height="60" rx="8"/>
  <text class="txt" x="250" y="270">
    Clear Daily Extremes
  </text>

  <line class="arrow"
        x1="250"
        y1="300"
        x2="250"
        y2="340"
        marker-end="url(#arrowhead)"/>

  <!-- Step 4 -->

  <rect class="box" x="100" y="350" width="300" height="60" rx="8"/>
  <text class="txt" x="250" y="380">
    Begin New Collection Period
  </text>

</svg>