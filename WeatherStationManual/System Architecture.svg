<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820">

  <defs>
    <style>
      .title { font: bold 16px Arial, sans-serif; fill:#000; }
      .label { font: 14px Arial, sans-serif; fill:#000; }
      .small { font: 11px Arial, sans-serif; fill:#000; }
      .boxBlue { fill:#d9e2ec; stroke:#1565c0; stroke-width:2; }
      .boxGreen { fill:#d9ead3; stroke:#2e7d32; stroke-width:2; }
      .boxGold { fill:#efe2ba; stroke:#c97a00; stroke-width:2; }
      .boxGray { fill:#f2f2f2; stroke:#999; stroke-width:1; }

      .arrow {
        stroke:#1f3349;
        stroke-width:3;
        fill:none;
        marker-end:url(#arrow);
      }
    </style>

    <marker id="arrow"
      markerWidth="8"
      markerHeight="8"
      refX="7"
      refY="4"
      orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#1f3349"/>
    </marker>
  </defs>

  <!-- Radiation Shield Package -->

  <rect x="110" y="80" width="280" height="90" rx="10" class="boxBlue"/>
  <text x="250" y="115" text-anchor="middle" class="title">
    Radiation Shield
  </text>
  <text x="250" y="138" text-anchor="middle" class="title">
    Sensor Package
  </text>
  <text x="250" y="158" text-anchor="middle" class="small">
    SHT31-D • BMP280 • DS3231 RTC
  </text>

  <!-- Mast System -->

  <rect x="710" y="80" width="280" height="90" rx="10" class="boxBlue"/>
  <text x="850" y="115" text-anchor="middle" class="title">
    Mast-mounted
  </text>
  <text x="850" y="138" text-anchor="middle" class="title">
    Sensor System
  </text>
  <text x="850" y="158" text-anchor="middle" class="small">
    Wind • Rain Sensors
  </text>

  <!-- ESP32-C3 -->

  <rect x="710" y="240" width="280" height="110" rx="10" class="boxGreen"/>
  <text x="850" y="285" text-anchor="middle" class="title">
    ESP32-C3 Outdoor Node
  </text>
  <text x="850" y="312" text-anchor="middle" class="small">
    Wind Processing
  </text>
  <text x="850" y="330" text-anchor="middle" class="small">
    Rain Processing
  </text>

  <!-- Arduino Mega -->

  <rect x="410" y="400" width="280" height="110" rx="10" class="boxGreen"/>
  <text x="550" y="447" text-anchor="middle" class="title">
    Arduino Mega 2560
  </text>
  <text x="550" y="474" text-anchor="middle" class="small">
    Main Weather Controller
  </text>

  <!-- ESP32-S3 -->

  <rect x="410" y="580" width="280" height="110" rx="10" class="boxGreen"/>
  <text x="550" y="627" text-anchor="middle" class="title">
    ESP32-S3 Gateway
  </text>
  <text x="550" y="652" text-anchor="middle" class="small">
    Dashboard and Upload Services
  </text>

  <!-- Dashboard -->

  <rect x="40" y="590" width="200" height="80" rx="10" class="boxGold"/>
  <text x="140" y="635" text-anchor="middle" class="title">
    Web Dashboard
  </text>

  <!-- Weather Underground -->

  <rect x="860" y="590" width="200" height="80" rx="10" class="boxGold"/>
  <text x="960" y="628" text-anchor="middle" class="title">
    Weather
  </text>
  <text x="960" y="650" text-anchor="middle" class="title">
    Underground
  </text>

  <!-- Database -->

  <rect x="430" y="720" width="240" height="50" rx="8" class="boxGold"/>
  <text x="550" y="751" text-anchor="middle" class="title">
    Database
  </text>

  <!-- Connections -->

  <!-- Radiation Shield -> Mega -->
  <line x1="250" y1="170" x2="250" y2="455" class="arrow"/>
  <line x1="250" y1="455" x2="410" y2="455" class="arrow"/>

  <text x="280" y="315" class="small">I²C Sensor Bus</text>

  <!-- Mast Sensors -> ESP32 -->
  <line x1="850" y1="170" x2="850" y2="240" class="arrow"/>

  <!-- ESP32 -> Mega -->
  <line x1="850" y1="350" x2="850" y2="455" class="arrow"/>
  <line x1="850" y1="455" x2="690" y2="455" class="arrow"/>

  <text x="785" y="410" class="small">LoRa Link</text>

  <!-- Mega -> S3 -->
  <line x1="550" y1="510" x2="550" y2="580" class="arrow"/>

  <!-- S3 -> Dashboard -->
  <line x1="410" y1="625" x2="240" y2="625" class="arrow"/>

  <!-- S3 -> Weather Underground -->
  <line x1="690" y1="625" x2="860" y2="625" class="arrow"/>

  <!-- S3 -> Database -->
  <line x1="550" y1="690" x2="550" y2="720" class="arrow"/>

  <!-- Description -->

  <rect x="35" y="785" width="1030" height="28" rx="4" class="boxGray"/>

  <text x="550" y="803" text-anchor="middle" class="small">
    Weather data originates from the Radiation Shield Sensor Package and the Mast-mounted Sensor System,
    is consolidated by the Arduino Mega, processed by the ESP32-S3 gateway, and distributed to local and cloud services.
  </text>

</svg>