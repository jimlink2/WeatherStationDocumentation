<svg xmlns="http://www.w3.org/2000/svg"
     width="500"
     height="380"
     viewBox="0 0 500 380">

  <defs>
    <style>
      .box {
        fill: #EAF3FF;
        stroke: #000000;
        stroke-width: 2;
      }

      .txt {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 18px;
        font-weight: bold;
        text-anchor: middle;
        dominant-baseline: middle;
      }

      .arrow {
        stroke: #000000;
        stroke-width: 2;
        fill: none;
      }
    </style>

    <marker id="arrowhead"
            markerWidth="10"
            markerHeight="10"
            refX="8"
            refY="5"
            orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#000000"/>
    </marker>
  </defs>

  <!-- Level 1 -->

  <rect class="box"
        x="75"
        y="20"
        width="350"
        height="60"
        rx="8"/>

  <text class="txt"
        x="250"
        y="50">
    Collect Data First
  </text>

  <line class="arrow"
        x1="250"
        y1="80"
        x2="250"
        y2="130"
        marker-end="url(#arrowhead)"/>

  <!-- Level 2 -->

  <rect class="box"
        x="75"
        y="140"
        width="350"
        height="60"
        rx="8"/>

  <text class="txt"
        x="250"
        y="170">
    Display Data Second
  </text>

  <line class="arrow"
        x1="250"
        y1="200"
        x2="250"
        y2="250"
        marker-end="url(#arrowhead)"/>

  <!-- Level 3 -->

  <rect class="box"
        x="75"
        y="260"
        width="350"
        height="60"
        rx="8"/>

  <text class="txt"
        x="250"
        y="290">
    Upload Data Third
  </text>

</svg>