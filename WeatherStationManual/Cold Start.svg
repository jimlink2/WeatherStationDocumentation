<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="420"
     viewBox="0 0 1200 420">

  <defs>
    <style>
      .box {
        fill: #EAF3FF;
        stroke: #000000;
        stroke-width: 2;
      }

      .txt {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        text-anchor: middle;
        dominant-baseline: middle;
      }

      .note {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 18px;
        font-weight: bold;
        text-anchor: middle;
      }

      .arrow {
        stroke: #000000;
        stroke-width: 2;
        fill: none;
      }
    </style>

    <marker id="arrowhead"
            markerWidth="10"
            markerHeight="10"
            refX="8"
            refY="5"
            orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#000000"/>
    </marker>
  </defs>

  <!-- TOP ROW -->

  <rect class="box" x="20" y="40" width="160" height="60" rx="8"/>
  <text class="txt" x="100" y="70">Power Applied</text>

  <rect class="box" x="230" y="40" width="190" height="60" rx="8"/>
  <text class="txt" x="325" y="70">Arduino Mega Starts</text>

  <rect class="box" x="470" y="40" width="150" height="60" rx="8"/>
  <text class="txt" x="545" y="70">RTC Restored</text>

  <rect class="box" x="670" y="40" width="250" height="60" rx="8"/>
  <text class="txt" x="795" y="70">Indoor Sensors Initialized</text>

  <!-- TOP ROW ARROWS -->

  <line class="arrow" x1="180" y1="70" x2="230" y2="70" marker-end="url(#arrowhead)"/>
  <line class="arrow" x1="420" y1="70" x2="470" y2="70" marker-end="url(#arrowhead)"/>
  <line class="arrow" x1="620" y1="70" x2="670" y2="70" marker-end="url(#arrowhead)"/>

  <!-- ROW CHANGE -->

  <line class="arrow" x1="920" y1="70" x2="1030" y2="70"/>
  <line class="arrow" x1="1030" y1="70" x2="1030" y2="220"/>
  <line class="arrow" x1="1030" y1="220" x2="920" y2="220"
        marker-end="url(#arrowhead)"/>

  <!-- BOTTOM ROW -->

  <rect class="box" x="730" y="190" width="190" height="60" rx="8"/>
  <text class="txt" x="825" y="220">ESP32-S3 Starts</text>

  <rect class="box" x="480" y="190" width="200" height="60" rx="8"/>
  <text class="txt" x="580" y="220">Wi‑Fi Established</text>

  <rect class="box" x="220" y="190" width="210" height="60" rx="8"/>
  <text class="txt" x="325" y="220">ESP32-C3 Node Starts</text>

  <rect class="box" x="20" y="190" width="150" height="60" rx="8"/>
  <text class="txt" x="95" y="220">LoRa Established</text>

  <!-- BOTTOM ROW ARROWS -->

  <line class="arrow" x1="730" y1="220" x2="680" y2="220"
        marker-end="url(#arrowhead)"/>

  <line class="arrow" x1="480" y1="220" x2="430" y2="220"
        marker-end="url(#arrowhead)"/>

  <line class="arrow" x1="220" y1="220" x2="170" y2="220"
        marker-end="url(#arrowhead)"/>

  <!-- RESULT -->

  <line class="arrow"
        x1="95"
        y1="250"
        x2="95"
        y2="310"
        marker-end="url(#arrowhead)"/>

  <text class="note" x="135" y="355">
    Dashboard Updates Begin
  </text>

</svg>